name: Actualizar geometría de calles (Overpass)

# Por qué esto vive en una Action y no se hace desde el navegador del
# usuario: la petición a Overpass se probó en vivo desde la app y se colgaba
# hasta timeout dependiendo de la red del usuario (ver commit "Sustituir
# Overpass por lectura directa de las teselas del mapa"). Los runners de
# GitHub Actions tienen salida a internet fiable, así que aquí sí funciona
# de forma consistente, y el resultado se deja como fichero estático
# (data/streets-geometry.json) que la app carga sin depender de Overpass en
# el momento de jugar.

on:
  workflow_dispatch: {} # permite lanzarlo a mano desde la pestaña Actions (o por API)
  schedule:
    - cron: "0 4 1 * *" # el día 1 de cada mes a las 04:00 UTC
  push:
    paths:
      - "scripts/fetch-overpass-streets.mjs"
      - ".github/workflows/update-street-geometry.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Descargar geometría completa de Overpass
        run: node scripts/fetch-overpass-streets.mjs

      - name: Comitear si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/streets-geometry.json; then
            echo "Sin cambios en la geometría, no se comitea nada."
          else
            git add data/streets-geometry.json
            git commit -m "Actualizar geometría de calles desde Overpass [automático]"
            git push
          fi
